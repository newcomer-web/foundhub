/* ==========================================================================
   FOUNDHUB NEO-BRUTALIST DESIGN SYSTEM (STRICTLY PRESERVED)
   ========================================================================== */
:root {
  --bg: #fff;
  --surf: #fff;
  --ink: #0a0a0a;
  --mute: #4a4a4a;
  --line: #0a0a0a;
  --found: #ffd93d;
  --lost: #6c8cff;
  --tag: #ff8fc7;
  --tagink: #0a0a0a;
  --pri: #0a0a0a;
  --sh: #0a0a0a;
  --card-bg: #fff;
  --panel-bg: #f9f9fb;
  --code-bg: #f0f0f4;
  --success: #10b981;
  --lamp-accent: #ffd93d;
  --lamp-secondary: #ff8c00;
  --lamp-glow: rgba(255, 217, 61, 0.45);
  --lamp-cone: rgba(255, 217, 61, 0.16);
  --lamp-bulb: #fff5c0;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212;
    --surf: #1e1e1e;
    --ink: #f5f5f5;
    --mute: #c4c4c4;
    --line: #f5f5f5;
    --found: #ffd93d;
    --lost: #6c8cff;
    --tag: #ff8fc7;
    --tagink: #0a0a0a;
    --pri: #f5f5f5;
    --sh: #f5f5f5;
    --card-bg: #1e1e1e;
    --panel-bg: #181818;
    --code-bg: #282828;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #121212;
  --surf: #1e1e1e;
  --ink: #f5f5f5;
  --mute: #c4c4c4;
  --line: #f5f5f5;
  --found: #ffd93d;
  --lost: #6c8cff;
  --tag: #ff8fc7;
  --tagink: #0a0a0a;
  --pri: #f5f5f5;
  --sh: #f5f5f5;
  --card-bg: #1e1e1e;
  --panel-bg: #181818;
  --code-bg: #282828;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Archivo, system-ui, -apple-system, sans-serif;
  font-size-adjust: from-font;
  font-weight: 500;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, .logo {
  font-family: "Archivo Black", Impact, system-ui, sans-serif;
  font-size-adjust: cap-height from-font;
  font-weight: 400;
  letter-spacing: -0.02em;
  margin: 0;
  line-height: 1.15;
}

main#app {
  min-height: 85vh;
  contain-intrinsic-size: auto 900px;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}
button { cursor: pointer; }
:focus-visible {
  outline: 3px solid var(--tag);
  outline-offset: 2px;
}

.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 18px;
}

/* Telemetry Ribbon Header */
.telemetry-ribbon {
  background: var(--ink);
  color: var(--bg);
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  font-weight: 600;
  padding: 6px 0;
  border-bottom: 2px solid var(--ink);
}
.telemetry-ribbon .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.pulse-dot {
  position: relative;
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b981;
  margin-right: 6px;
  vertical-align: middle;
}
.pulse-dot::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: #10b981;
  animation: pulse-ring 1.8s cubic-bezier(0.24, 0, 0.38, 1) infinite;
  will-change: transform, opacity;
  pointer-events: none;
}
@keyframes pulse-ring {
  0% { transform: scale(1); opacity: 0.8; }
  70% { transform: scale(2.4); opacity: 0; }
  100% { transform: scale(2.4); opacity: 0; }
}

/* Navigation */
header {
  position: sticky;
  top: 0;
  background: var(--bg);
  border-bottom: 3px solid var(--ink);
  z-index: 100;
}
nav {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  flex-wrap: wrap;
}
.logo {
  font-size: 22px;
  margin-right: auto;
  display: flex;
  align-items: center;
  gap: 4px;
  text-decoration: none;
  color: var(--ink);
}
.logo i {
  font-style: normal;
  background: var(--found);
  color: #0a0a0a;
  border: 2.5px solid var(--ink);
  border-radius: 6px;
  padding: 0 8px;
  box-shadow: 3px 3px 0 var(--sh);
}
.logo-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 9px;
  font-weight: 800;
  background: var(--ink);
  color: var(--bg);
  padding: 2px 5px;
  border-radius: 4px;
  margin-left: 4px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Neo-Brutalist Buttons */
.btn {
  border: 2.5px solid var(--ink);
  border-radius: 6px;
  box-shadow: 3px 3px 0 var(--sh);
  font-weight: 700;
  background: var(--surf);
  color: var(--ink);
  padding: 8px 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform .12s cubic-bezier(0.16, 1, 0.3, 1), opacity .12s ease;
  text-decoration: none;
}
.btn:hover {
  filter: brightness(0.97);
}
.btn:active {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 var(--sh);
}
.btn.p {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.btn.f {
  background: var(--found);
  color: #0a0a0a;
  border-color: var(--ink);
}
.btn.l {
  background: var(--lost);
  color: #0a0a0a;
  border-color: var(--ink);
}
.btn.s {
  padding: 5px 12px;
  font-size: 13px;
}
.btn.on {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

/* Hero Section */
.hero {
  background: var(--found);
  color: #0a0a0a;
  border: 3px solid var(--ink);
  border-radius: 8px;
  box-shadow: 8px 8px 0 var(--sh);
  padding: 32px 26px;
  margin: 22px 0 20px;
}
.hero-tagline {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.hero h1 {
  font-size: clamp(32px, 6.5vw, 64px);
  line-height: 1.05;
  margin-bottom: 10px;
}
.hero p {
  color: #0a0a0a;
  max-width: 54ch;
  font-size: 16px;
  margin: 0 0 18px;
  font-weight: 500;
  line-height: 1.45;
}
.hero .row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

/* Metrics Counter Grid */
.telemetry-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 0 0 22px;
}
@media (max-width: 600px) {
  .telemetry-grid {
    grid-template-columns: 1fr;
  }
}
.metric-box {
  background: var(--surf);
  border: 2.5px solid var(--ink);
  border-radius: 6px;
  box-shadow: 4px 4px 0 var(--sh);
  padding: 12px 16px;
}
.metric-box .label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--mute);
  display: flex;
  align-items: center;
  gap: 6px;
}
.metric-box .val {
  font-family: "Archivo Black", sans-serif;
  font-size: 26px;
  margin-top: 3px;
  line-height: 1;
}

/* Simplified Filter & View Bar */
.filter-bar {
  background: var(--surf);
  border: 2.5px solid var(--ink);
  border-radius: 6px;
  box-shadow: 4px 4px 0 var(--sh);
  padding: 14px 16px;
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.search-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.search-row input {
  flex: 1 1 240px;
}
.search-row select {
  max-width: 200px;
}
.view-switch {
  display: inline-flex;
  border: 2.5px solid var(--ink);
  border-radius: 6px;
  overflow: hidden;
  margin-left: auto;
}
.view-switch button {
  border: none;
  background: var(--surf);
  padding: 8px 14px;
  font-weight: 700;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
  border-right: 1.5px solid var(--ink);
}
.view-switch button:last-child { border-right: none; }
.view-switch button.active {
  background: var(--ink);
  color: var(--bg);
}

.type-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.pill {
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 700;
  background: var(--surf);
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--sh);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: transform .1s;
}
.pill:active {
  transform: translate(1px, 1px);
}
.pill.active {
  background: var(--ink);
  color: var(--bg);
}
.pill.active.f {
  background: var(--found);
  color: #0a0a0a;
}
.pill.active.l {
  background: var(--lost);
  color: #0a0a0a;
}

input:not([type="checkbox"]):not([type="radio"]), select, textarea {
  border: 2.5px solid var(--ink);
  border-radius: 6px;
  background: var(--surf);
  color: var(--ink);
  padding: 9px 12px;
  width: 100%;
  font-size: 15px;
}
input:not([type="checkbox"]):not([type="radio"]):focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--ink);
  box-shadow: 3px 3px 0 var(--sh);
}
input[type="checkbox"], input[type="radio"] {
  width: 18px !important;
  height: 18px !important;
  min-width: 18px;
  margin: 0;
  cursor: pointer;
  accent-color: var(--ink);
  flex-shrink: 0;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Grid & Cards */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 18px;
  padding-bottom: 40px;
}
.card {
  display: grid;
  grid-template-columns: 56px 1fr;
  column-gap: 14px;
  row-gap: 4px;
  align-items: start;
  border: 3px solid var(--ink);
  border-radius: 8px;
  box-shadow: 5px 5px 0 var(--sh);
  padding: 16px;
  background: var(--surf);
  text-align: left;
  transition: transform .15s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
  content-visibility: auto;
  contain-intrinsic-size: auto 160px;
}
.card:hover {
  transform: translate(-2px, -2px);
}
.card > *:not(.glyph) {
  grid-column: 2;
  justify-self: start;
}
.card .glyph {
  grid-row: 1 / span 5;
  width: 56px;
  height: 56px;
  background: var(--surf);
  color: var(--ink);
  border: 2.5px solid var(--ink);
  border-radius: 6px;
  display: inline-grid;
  place-items: center;
  overflow: hidden;
  box-shadow: 2px 2px 0 var(--sh);
}
.card .glyph img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  aspect-ratio: 1 / 1;
  display: block;
}
.card .glyph svg {
  width: 28px;
  height: 28px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
}
.card:has(.badge.FOUND) .glyph { background: var(--found); }
.card:has(.badge.LOST) .glyph { background: var(--lost); }

.card-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 2px;
}
.badge {
  display: inline-block;
  font-weight: 800;
  font-size: 11px;
  padding: 2px 8px;
  border: 2px solid var(--ink);
  border-radius: 4px;
  text-transform: uppercase;
}
.badge.FOUND { background: var(--found); color: #0a0a0a; }
.badge.LOST { background: var(--lost); color: #0a0a0a; }

.meta {
  color: var(--mute);
  font-size: 13px;
  line-height: 1.4;
  word-break: break-word;
}
.bounty-pill {
  background: var(--tag);
  color: var(--tagink);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  font-size: 11px;
  font-weight: 800;
  padding: 1px 6px;
  margin-top: 4px;
}
.card-actions {
  margin-top: 8px;
  width: 100%;
}

/* Radar Map Container */
.map-view-container {
  border: 3px solid var(--ink);
  border-radius: 8px;
  box-shadow: 6px 6px 0 var(--sh);
  overflow: hidden;
  background: var(--surf);
  margin-bottom: 30px;
}
.map-header {
  padding: 12px 18px;
  background: var(--ink);
  color: var(--bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  font-weight: 700;
}
#radarMap {
  width: 100%;
  height: 500px;
  background: #111;
}

/* Dialog & Modals */
dialog {
  border: 3px solid var(--ink);
  border-radius: 8px;
  box-shadow: 8px 8px 0 var(--sh);
  background: var(--surf);
  color: var(--ink);
  padding: 0;
  max-width: 640px;
  width: calc(100% - 28px);
}
dialog::backdrop {
  background: rgba(10, 10, 10, 0.65);
  backdrop-filter: blur(2px);
}
.dlg {
  padding: 22px;
  max-height: 88vh;
  overflow-y: auto;
}
.dlg-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
  border-bottom: 2.5px solid var(--ink);
  padding-bottom: 12px;
}


#viewContainer {
  min-height: 480px;
}
.empty-panel {
  min-height: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 44px 20px;
}

.panel {
  border: 2.5px solid var(--ink);
  border-radius: 6px;
  background: var(--panel-bg);
  padding: 14px 16px;
  margin: 14px 0;
}
.panel dt {
  font-weight: 700;
  font-size: 12px;
  color: var(--mute);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.panel dd {
  margin: 2px 0 10px;
  font-size: 15px;
  font-weight: 600;
}

.safe-box {
  border: 2px solid var(--ink);
  border-radius: 6px;
  background: var(--tag);
  color: #0a0a0a;
  padding: 12px 14px;
  font-size: 13px;
  font-weight: 600;
  margin: 14px 0;
  line-height: 1.45;
}

/* Step Wizard Progress */
.wizard-steps {
  display: flex;
  gap: 6px;
  margin: 12px 0 20px;
}
.wizard-steps .step-bar {
  height: 10px;
  flex: 1;
  border: 2px solid var(--ink);
  border-radius: 2px;
  background: var(--bg);
  transition: background .2s;
}
.wizard-steps .step-bar.done {
  background: var(--found);
}
.step-title {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--mute);
  text-transform: uppercase;
  margin-bottom: 4px;
}

/* PII Masking Tool Box */
.pii-mask-tool {
  background: #fff1f2;
  border: 2.5px solid var(--ink);
  border-radius: 6px;
  padding: 14px;
  margin: 14px 0;
}
.pii-mask-tool h4 {
  font-size: 13px;
  text-transform: uppercase;
  color: #be123c;
  margin-bottom: 6px;
}
.pii-mask-tool p {
  font-size: 13px;
  color: #881337;
  margin: 0 0 10px;
}
.pii-input-group {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
}

/* Location Chips */
.chips-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 8px 0 12px;
}
.chip {
  background: var(--surf);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 8px;
  cursor: pointer;
  transition: background .1s;
}
.chip:hover {
  background: var(--found);
}

/* Dashboard Tabs */
.dash-tabs {
  display: flex;
  gap: 8px;
  border-bottom: 3px solid var(--ink);
  padding-bottom: 12px;
  margin: 20px 0;
  flex-wrap: wrap;
}
.dash-profile-card {
  background: var(--surf);
  border: 3px solid var(--ink);
  border-radius: 8px;
  box-shadow: 6px 6px 0 var(--sh);
  padding: 16px 20px;
  margin: 20px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
}
.user-node-badge {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  font-weight: 800;
  background: var(--ink);
  color: var(--bg);
  padding: 2px 8px;
  border-radius: 4px;
  text-transform: uppercase;
}

/* Telegram Broadcast Feed */
.tg-feed-item {
  background: var(--surf);
  border: 2.5px solid var(--ink);
  border-radius: 6px;
  box-shadow: 4px 4px 0 var(--sh);
  padding: 16px;
  margin-bottom: 14px;
}
.tg-channel-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  font-weight: 700;
  color: #0284c7;
}
.tg-content-box {
  background: var(--code-bg);
  border: 1.5px solid var(--ink);
  border-radius: 6px;
  padding: 12px;
  margin: 10px 0;
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  white-space: pre-wrap;
  line-height: 1.45;
}

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--ink);
